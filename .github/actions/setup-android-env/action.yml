name: Set up Node, JDK, Android SDK, and Gradle
description: Shared toolchain setup for Android CI and APK workflows

inputs:
  cache-prefix:
    description: Prefix for the Gradle package cache key
    required: true
  cache-build-outputs:
    description: Whether to include **/build directories in the Gradle cache
    required: false
    default: 'false'
  setup-node:
    description: Whether to configure Node.js
    required: false
    default: 'false'
  node-version:
    description: Node.js version to install when setup-node is true
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Cache Gradle packages
      if: inputs.cache-build-outputs != 'true'
      uses: actions/cache@v4.2.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ inputs.cache-prefix }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ inputs.cache-prefix }}-

    - name: Cache Gradle packages and build outputs
      if: inputs.cache-build-outputs == 'true'
      uses: actions/cache@v4.2.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          **/build
        key: ${{ runner.os }}-gradle-${{ inputs.cache-prefix }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ inputs.cache-prefix }}-

    - name: Set up JDK 17
      uses: actions/setup-java@v5.0.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Accept Android SDK licenses
      shell: bash
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        printf "24333f8a63cbd82ea14e1861ee225939c7f20e57\n893fb8a22d82224b8478fb7fa5148fdb92fd55e6\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
        printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        printf "601085b00ccd4a54464587335ab260c3e10290bf\n" > "$ANDROID_HOME/licenses/android-googletv-license"
        printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
        printf "33b6a2b64707f15b6fadd8c374170d9949e7e0d2\n" > "$ANDROID_HOME/licenses/google-gdk-license"
        printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" > "$ANDROID_HOME/licenses/intel-android-extra-license"
        printf "e9acab5b5fbb560a72cfa4e23e338b00a0815979\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3.2.1
      with:
        cmdline-tools-version: '11076708'
        accept-android-sdk-licenses: true
        packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4.3.0

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
