name: Android Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node 24, Android SDK, and Gradle
        uses: ./.github/actions/setup-android-env
        with:
          cache-prefix: apk
          setup-node: 'true'
          node-version: '24'

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -r dist/* app/src/main/assets/

      - name: Run Policy and Schema Gates
        run: ./gradlew :verifyDomainPurity :scanProhibitedPhrasing :scanApkSecrets :verifySourceEncoding :data:kspDebugKotlin -PwarningsAsErrors=true

      - name: Run Unit Tests and Static Analysis
        run: ./gradlew :domain:test testDebugUnitTest lintDebug detekt ktlintCheck -PwarningsAsErrors=true

      - name: Build Debug APK
        env:
          ORG_GRADLE_PROJECT_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          ORG_GRADLE_PROJECT_ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ORG_GRADLE_PROJECT_DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          ORG_GRADLE_PROJECT_BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
        run: |
          ./gradlew :app:assembleDebug -PwarningsAsErrors=true
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: unified-cloud-file-manager-fixed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
