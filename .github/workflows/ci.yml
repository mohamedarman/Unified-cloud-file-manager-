name: CI

# Every gate here is BLOCKING (Architecture.md §27.2).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  policy:
    name: Policy and structure gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Android and Gradle toolchain
        uses: ./.github/actions/setup-android-env
        with:
          cache-prefix: policy

      - name: Verify domain purity
        run: ./gradlew :verifyDomainPurity

      - name: Scan for prohibited storage claims
        run: ./gradlew :scanProhibitedPhrasing

      - name: Scan for secrets
        run: ./gradlew :scanApkSecrets

      - name: Verify source encoding
        run: ./gradlew :verifySourceEncoding

      - name: Verify Gradle wrapper is checksum-pinned
        run: |
          if ! grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties; then
            echo "::error::gradle-wrapper.properties has no distributionSha256Sum."
            exit 1
          fi

  build:
    name: Build and static analysis
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node 24, Android SDK, and Gradle
        uses: ./.github/actions/setup-android-env
        with:
          cache-prefix: build
          cache-build-outputs: 'true'
          setup-node: 'true'
          node-version: '24'

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -r dist/* app/src/main/assets/

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease -PwarningsAsErrors=true

      - name: Lint
        run: ./gradlew lintDebug -PwarningsAsErrors=true

      - name: Detekt
        run: ./gradlew detekt

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: detekt-report
          path: '**/build/reports/detekt/**'
          retention-days: 7

  unit-test:
    name: Unit tests
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node 24, Android SDK, and Gradle
        uses: ./.github/actions/setup-android-env
        with:
          cache-prefix: unit
          setup-node: 'true'
          node-version: '24'

      - name: Prepare web assets
        run: |
          npm ci
          npm run build
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -r dist/* app/src/main/assets/

      - name: Domain unit tests
        run: ./gradlew :domain:test --rerun-tasks -PwarningsAsErrors=true

      - name: Module unit tests
        run: ./gradlew testDebugUnitTest -PwarningsAsErrors=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**/*.html'
          retention-days: 7

  migration:
    name: Room migration check
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Android SDK and Gradle
        uses: ./.github/actions/setup-android-env
        with:
          cache-prefix: migration

      - name: Check Room schema state
        run: |
          if [ -d data/schemas ] && [ -n "$(ls -A data/schemas 2>/dev/null)" ]; then
            echo "Room schema present. Verifying schema generation via KSP."
          else
            echo "::notice::No Room schema yet."
          fi

      - name: Generate schemas
        run: ./gradlew :data:kspDebugKotlin -PwarningsAsErrors=true

      - name: Verify Room schema integrity
        run: |
          SCHEMA_FILE="data/schemas/com.unifiedcloud.filemanager.data.db.AppDatabase/1.json"
          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "::error::Expected Room schema $SCHEMA_FILE was not generated by KSP."
            exit 1
          fi
          grep -q '"connected_account"' "$SCHEMA_FILE"
          grep -q '"file_metadata"' "$SCHEMA_FILE"
          grep -q '"pending_operation"' "$SCHEMA_FILE"
          echo "Room schema verified."

  instrumented:
    name: Instrumented tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node 24, Android SDK, and Gradle
        uses: ./.github/actions/setup-android-env
        with:
          cache-prefix: inst
          setup-node: 'true'
          node-version: '24'

      - name: Prepare web assets
        run: |
          npm ci
          npm run build
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -r dist/* app/src/main/assets/

      - name: Compile Android test APK
        run: ./gradlew assembleDebugAndroidTest -PwarningsAsErrors=true

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::KVM hardware virtualization not available on this runner; skipping emulator execution after verifying assembleDebugAndroidTest."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run instrumented tests
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest
          disable-animations: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: instrumented-reports
          path: '**/build/reports/androidTests/**'
          retention-days: 7

  required:
    name: All gates green
    if: always()
    needs: [policy, build, unit-test, migration, instrumented]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail if any gate failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::At least one required gate failed or was cancelled. This branch is not mergeable."
            exit 1
          fi
          echo "All required gates passed."
