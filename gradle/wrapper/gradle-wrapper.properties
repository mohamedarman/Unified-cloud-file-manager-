distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip

# Pinned per D-1.2 / docs/environment/toolchain.md §5. A wrapper whose
# distribution is not checksummed is a supply-chain hole, not a convenience.
#
# distributionSha256Sum is DELIBERATELY ABSENT. No hash has been written here,
# because no value was available to write and inventing one would be worse than
# leaving it out: a fabricated hash looks authoritative and would either be
# deleted by a future maintainer or, if it happened to be "fixed" by copying a
# value from an unverified source, would defeat the check entirely.
#
# TO COMPLETE (first build, requires JDK 17):
#   1. gradle wrapper --gradle-version 8.11.1 --gradle-distribution-sha256-sum <HASH>
#      where <HASH> is read from https://gradle.org/release-checksums/
#   2. Commit this file with the resulting distributionSha256Sum line.
#
# Until step 2 is done, the distribution is NOT checksum-verified. This is
# tracked as blocker B-5 in Memory.md §4.

networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
