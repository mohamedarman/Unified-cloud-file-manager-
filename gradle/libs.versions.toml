[versions]
# Toolchain. Pinned by decision D-1.2 (Memory.md). Do not bump one of these
# without re-checking the whole triple - see docs/environment/toolchain.md.
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# AndroidX / SDK. PROVISIONAL per D-1.1 - minSdk floor unverified (D-1.3 / Q-12).
compileSdk = "35"
minSdk = "26"
targetSdk = "35"

# AndroidX libraries
coreKtx = "1.13.1"
appcompat = "1.7.0"
activityCompose = "1.9.2"
lifecycle = "2.8.6"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
room = "2.6.1"
datastore = "1.1.1"
workManager = "2.9.1"
paging = "3.3.2"
documentfile = "1.0.1"
security = "1.1.0-alpha06"

# Kotlin ecosystem
coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "4.12.0"

# Auth. AuthorizationClient viability is Q-01 / V-05 - UNVALIDATED (Memory.md §2).
# If Q-01 and Q-02 both resolve against a custom flow, AppAuth replaces this
# (Architecture.md §4.2). Do not add AppAuth speculatively.
credentials = "1.3.0"
credentialsPlayServices = "1.3.0"

# Images
coil = "2.7.0"

# Test
junit = "4.13.2"
mockWebServer = "4.12.0"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"
espresso = "3.6.1"

# Quality gates. Architecture.md §27.2 requires all of these.
detekt = "1.23.7"
ktlintPlugin = "12.1.1"

[libraries]
# --- Kotlin ---
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- AndroidX core ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# --- Compose ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Storage ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# --- Work ---
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workManager" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# --- Security ---
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security" }

# --- Auth. Q-01 UNVALIDATED. See Memory.md §2. ---
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentialsPlayServices" }

# --- HTTP ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockWebServer" }

# --- Images ---
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# --- Test ---
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# --- Quality ---
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Pure JVM. This is what makes :domain structurally incapable of importing an
# Android type (Rules.md L-1, ADR-10).
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# From Kotlin 2.0 the Compose compiler ships as a Kotlin plugin, so there is no
# separate compiler version to keep in sync (D-1.2).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
