# Gradle
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only. Jetifier is not needed for a greenfield app and it slows every build.
android.useAndroidX=true
android.enableJetifier=false

# Build behaviour
kotlin.code.style=official

# Room schema export. Required by MIG-1/MIG-5: the schema is committed so an
# un-migrated entity fails CI rather than production (Rules.md DB-5).
ksp.incremental=true
