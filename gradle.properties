# Gradle
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only. Jetifier is not needed for a greenfield app and it slows every build.
android.useAndroidX=true
android.enableJetifier=false

# Build behaviour
kotlin.code.style=official

# Room schema export. Required by MIG-1/MIG-5: the schema is committed so an
# un-migrated entity fails CI rather than production (Rules.md DB-5).
ksp.incremental=true
