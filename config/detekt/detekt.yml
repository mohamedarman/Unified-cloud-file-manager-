# Detekt configuration.
#
# buildUponDefaultConfig = true in build.gradle.kts, so this file states only
# what this project wants to differ on. Architecture.md §27.2 makes detekt
# blocking, so an entry here is an enforced rule, not advice.

build:
  maxIssues: 0

console-reports:
  active: true

complexity:
  LongParameterList:
    # CloudProvider methods legitimately take an account id, a file id, and a
    # few options. The account id is the point of the signature (I-1), not an
    # oversight, so a long list here is a deliberate design rather than a smell.
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInObjects: 30
    # The action matrix and the retry policy are deliberately exhaustive
    # decision tables. Splitting them to satisfy a count would scatter one rule
    # across several places, which is the actual defect that rule guards against.
    ignoreAnnotatedFunctions: [ 'Override' ]

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
  # AppError.Unknown deliberately carries a Throwable for diagnostics. Losing it
  # is the failure this rule prevents, so carrying it must be possible.
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  # Matches the public value classes (LocalAccountId, ProviderFileId, FileRef).
  TopLevelPropertyNaming:
    active: false
  FunctionNaming:
    active: true
    # Compose @Composable functions are PascalCase by convention.
    ignoreAnnotated: [ 'Composable' ]

performance:
  SpreadOperator:
    active: true

potential-bugs:
  # Domain invariants are enforced with require(); a nullable field is a bug.
  UnsafeCallOnNullableType:
    active: false

style:
  MagicNumber:
    active: true
    ignoreNumbers: [ '-1', '0', '1', '2', '3', '4', '5', '8', '16', '32', '100', '256', '1000' ]
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreConstantDeclaration: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    # Early returns that classify a failure are clearer than a single exit with
    # a nested conditional. RetryPolicy is the intended example.
    max: 4
  UnusedPrivateMember:
    active: true
  ForbiddenComment:
    active: true
    # TODO/FIXME become stale and are the usual home for an unrecorded decision.
    # Decisions belong in Memory.md, which has an owner and a date.
    values: [ 'FIXME', 'STOPSHIP', 'HACK' ]
    allowedPatterns: [ 'TODO: Decision recorded in Memory.md' ]

formatting:
  active: true
  # Formatting/import-order is ktlint's job, applied per-module with the correct
  # Android flag (:domain and :core are not Android). Setting it here as well
  # would apply Android rules to pure-JVM code and produce false failures.
  android: false
  AutoCorrect: false
  MaximumLineLength:
    active: true
    maxLineLength: 120
  FunctionNaming:
    active: true
    ignoreAnnotated: [ 'Composable' ]
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  Indentation:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  NoWildcardImports:
    active: true
