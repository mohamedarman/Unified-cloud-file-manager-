<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Page Titles & Identity -->
    <title>Unified Cloud File Manager – Multi-Cloud Workspace</title>
    <meta
      name="description"
      content="Unified interface for managing authorized files across Google Drive, Microsoft OneDrive, Dropbox, and Box with multi-account isolation, gallery view, cross-cloud search, and offline operation queue."
    />
    <meta name="author" content="Unified Cloud File Manager" />

    <!-- Strict Content Security Policy & Protocol Hygiene -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseio.com https://*.firebaseapp.com https://graph.microsoft.com https://login.microsoftonline.com https://*.dropboxapi.com https://*.box.com https://api.box.com https://upload.box.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unified Cloud File Manager" />
    <meta property="og:title" content="Unified Cloud File Manager – Multi-Cloud Workspace" />
    <meta
      property="og:description"
      content="Unified interface for managing authorized files across Google Drive, Microsoft OneDrive, Dropbox, and Box with multi-account isolation, gallery view, cross-cloud search, and offline operation queue."
    />
    <meta property="og:image" content="./og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="Unified Cloud File Manager Workspace Preview" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unified Cloud File Manager – Multi-Cloud Workspace" />
    <meta
      name="twitter:description"
      content="Unified interface for managing authorized files across Google Drive, Microsoft OneDrive, Dropbox, and Box with multi-account isolation, gallery view, cross-cloud search, and offline operation queue."
    />
    <meta name="twitter:image" content="./og-image.svg" />

    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MultiCloud" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Unified Cloud File Manager",
      "applicationCategory": "BusinessApplication, ProductivityApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "A client-side unified interface for managing authorized files across Google Drive, OneDrive, Dropbox, and Box accounts with strict multi-account isolation, quota governance, and offline operations.",
      "featureList": [
        "Multi-Account Isolation",
        "Cross-Cloud Search",
        "Quota Governance",
        "Offline Operation Queue",
        "Media Gallery Preview",
        "Client-Side Direct-to-Provider Architecture"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <style>@keyframes ucfm-spin { to { transform: rotate(360deg); } }</style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: ucfm-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; color: #38bdf8; margin-bottom: 8px;">Unified Cloud File Manager</div>

          <div style="margin-top: 16px; color: #ef4444; font-size: 0.85rem;">JavaScript is required to run Unified Cloud File Manager.</div>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
