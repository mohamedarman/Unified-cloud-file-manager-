<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Page Titles & Identity -->
    <title>Unified Cloud File Manager – Multi-Cloud Workspace</title>
    <meta
      name="description"
      content="Unified interface for managing authorized files across Google Drive, Microsoft OneDrive, Dropbox, and Box with multi-account isolation, gallery view, cross-cloud search, and offline operation queue."
    />
    <link rel="canonical" href="https://unified-cloud-file-manager.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Unified Cloud File Manager" />
    <meta name="keywords" content="cloud file manager, Google Drive, OneDrive, Dropbox, Box, multi-account isolation, cross-cloud search, quota governance" />

    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

    <meta property="og:title" content="Unified Cloud File Manager – Multi-Cloud Workspace" />

      property="og:description"
      content="Unified interface for managing authorized files across Google Drive, Microsoft OneDrive, Dropbox, and Box with multi-account isolation, gallery view, cross-cloud search, and offline operation queue."

    <meta property="og:image:type" content="image/svg+xml" />

      name="twitter:description"
      content="Unified interface for managing authorized files across Google Drive, Microsoft OneDrive, Dropbox, and Box with multi-account isolation, gallery view, cross-cloud search, and offline operation queue."

    <meta name="twitter:image" content="/og-image.svg" />
    
    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a73e8" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MultiCloud" />
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Unified Cloud File Manager",
      "applicationCategory": "BusinessApplication, ProductivityApplication",
      "operatingSystem": "All",

      "featureList": [
        "Multi-Account Isolation",
        "Cross-Cloud Search",
        "Quota Governance",
        "Offline Operation Queue",
        "Media Gallery Preview",
        "Zero-Storage Footprint"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white min-h-screen">

      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: ucfm-spin 0.9s linear infinite; margin-bottom: 20px;"></div>

        <noscript>
          <div style="margin-top: 16px; color: #ef4444; font-size: 0.85rem;">JavaScript is required to run Unified Cloud File Manager.</div>
        </noscript>
        <style>@keyframes ucfm-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
