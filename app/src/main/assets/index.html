<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Cloud File Manager</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: #1e293b;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 100%;
      }
      h1 { font-size: 1.5rem; margin-bottom: 12px; color: #38bdf8; }
      p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Unified Cloud File Manager</h1>
      <p>Mobile workspace environment active.</p>
    </div>
  </body>
</html>
